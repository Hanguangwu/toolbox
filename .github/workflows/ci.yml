name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 部署分工（方案 A）：
#   Vercel 生产与 PR 预览 → Vercel Git 集成（Dashboard 里连 GitHub 仓库即可），域名走
#   Vercel 系统变量 VERCEL_PROJECT_PRODUCTION_URL，在控制台绑自定义域名后自动跟随。
#   本 workflow 只负责：
#     - 三道闸（validate / test / build + verify:dist）
#     - GitHub Pages 镜像（deploy-pages.mjs 推 dist 到 <repo>-pages）
#   因此这里不再做 `vercel deploy`，避免与 Git 集成双份部署互相覆盖。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install deps
        run: pnpm install --frozen-lockfile

      # ---- 三道闸 ----
      - name: "gate 1 · validate"
        run: pnpm validate

      - name: "gate 2 · test"
        run: pnpm test

      # Pages 镜像构建：用 GITHUB_PAGES_URL 兜底（<owner>.github.io/<repo>）。
      # 生产 Vercel 构建由 Vercel Git 集成单独完成，域名由 Vercel 系统变量注入，无需在此处理。
      - name: "gate 3 · build (Pages mirror domain)"
        env:
          CI: "1"
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build

      - name: "verify build artifacts"
        run: node scripts/verify-dist.mjs

      - name: "upload dist"
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      # ---- Pages 镜像（main 推送时更新；镜像失败不阻断）----
      - name: "deploy · GitHub Pages mirror"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: node scripts/deploy-pages.mjs
