id: anki-studio
name: Anki Studio
description: "Anki 插件，重构桌面 UI 为沉浸式工作区，提供 FSRS 分析、休假模式与逾期卡片分摊，免游戏化。"
how: "100% 走 Anki 原生 Python API（col.update_card/col.sched），不动 FSRS 数据与 AnkiWeb 同步；复习时隐藏侧栏，自定义模板在隔离沙盒帧内运行，支持 Image Occlusion 只读渲染。"
