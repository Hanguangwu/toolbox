# 分类与标签的唯一词表。
# 规则：
#   - categories 是封闭枚举，新增需人工批准（且该分类下已积累 >= 30 条）
#   - tags 是半封闭词表：Agent 只能使用 canonical id；写别名会被 validate 拒绝并提示 canonical
#   - 单条目最多 5 个标签；单标签条目数 >= 3 才会生成标签页

categories:
  - id: ai
    name: 人工智能
    hint: 模型、推理、Agent 与应用
  - id: dev
    name: 开发
    hint: 编程、构建、调试与协作
  - id: design
    name: 设计
    hint: 排版、图形与视觉资产
  - id: media
    name: 音视频图像
    hint: 图片、视频、音频的处理与创作
  - id: security
    name: 安全
    hint: 编解码、加解密与取证
  - id: data
    name: 数据
    hint: 数据库、分析与可视化
  - id: productivity
    name: 效率
    hint: 笔记、文件与日常流程
  - id: writing
    name: 写作
    hint: 文档、翻译与文字加工
  - id: learning
    name: 学习
    hint: 教程、课程与知识库
  - id: system
    name: 系统
    hint: 操作系统层面的工具与管理
